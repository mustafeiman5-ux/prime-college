<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Super Software - Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; display: flex; }
        #sidebar { width: 200px; background: #333; color: white; height: 100vh; padding: 20px; }
        #main { flex: 1; padding: 20px; }
        .section { display: none; }
        .active { display: block; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .profile-img { width: 150px; height: 150px; border-radius: 50%; border: 5px solid #0072ff; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Super Software</h2>
    <ul style="list-style: none; padding: 0;">
        <li onclick="showSection('dashboard')">Dashboard</li>
        <li onclick="showSection('profile')">Profile</li>
    </ul>
</div>

<div id="main">
    <!-- DASHBOARD SECTION -->
    <div id="dashboard" class="section active">
        <h1>Welcome to Super Software Management System</h1>
        <p>Halkan waa xogta guud ee maamulka.</p>
    </div>

    <!-- PROFILE SECTION -->
    <div id="profile" class="section">
        <div class="card" style="text-align:center;">
            <h2>Super Software - Profile</h2>
            <div class="profile-header">
                <!-- Halkan geli link-ga sawirkaaga -->
                <img src="sawirkaaga.jpg" alt="Mustafe Iman Hirad" class="profile-img">
                <h1>Mustafe Iman Hirad</h1>
            </div>
            <div style="margin-top:20px; text-align:left; max-width:400px; margin:20px auto;">
                <p><strong>Phone:</strong> 634862916</p>
                <p><strong>Email:</strong> mustafeiman5@gmail.com</p>
                <p><strong>Location:</strong> Hargeysa</p>
            </div>
        </div>
    </div>
</div>

<script>
    function showSection(id) {
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>

</body>
</html>
